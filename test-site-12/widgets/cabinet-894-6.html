<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>안전서가의 연결 자료</title><link rel="stylesheet" href="../assets/site.css"><script src="../assets/portal.js"></script></head><body class="resource-body"><h2 class="resource-heading">함께 읽는 자료함</h2><div class="dispatch-body"><section class="reading-section" data-area="context"><h3>함께 읽은 문장</h3><p class="entry-note">금지 마약류의 반복 구매 <span>고객에게 혜택을 준다고 홍보</span>하는 합성 판매 안내입니다.</p></section><section class="reading-section" data-area="reference"><h3>함께 읽은 문장</h3><p class="entry-note">ＣＯＰＹ 상점은 유명 상표를<span> 복제한 가품을 정품 포장처럼</span> 꾸며 판매한다고 홍보합니다.</p></section><section class="reading-section" data-area="margin"><h3>함께 읽은 문장</h3><p class="entry-note">구호 물품을 가장해 가품을 파는<span> 광고를 경계하고 출처를 살피도</span>록 안내하는 예방 교육자료입니다.</p></section></div><p class="resource-note">기관·문장·자료는 합성이며 실제 접수·거래를 안내하지 않습니다.</p></body></html>
